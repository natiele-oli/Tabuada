<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada JS</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h2>Digite um número e confirme para gerar uma tabuada</h2>
    <form id="multplication-form">
        <div class="form-control">
            <label for="number">Tabuada do:</label>
            <input type="number" name="number" id="number" placeholder="3">
        </div>
        <div class="form-control">
            <label for="multplicator">Multplicar até</label>
            <input type="number" name="multplicator" id="multplicator" value="10">
        </div>
        <input type="submit" value="calcular">
    </form>
    <div id="multplication-table">
      <h2 id="multplication-title">Tabuada do número <span></span></h2>
       <div id="multplication-operations">
        <p>Informe um número para calcular uma tabuada</p>
        <div class="row">
            <div class="operation">2x2</div>
            <div class="result">4</div>
        </div>
        <div class="row">
            <div class="operation">2x3</div>
            <div class="result">6</div>
        </div>
       </div>
    </div>
    
    
</body>
</html>
